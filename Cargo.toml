[package]
name = "rinha"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1"
half = "2"
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
